<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#D81B60"><title>ビヨログ</title><style>:root{--pink:#D81B60;--light:#fff0f5;--ink:#28232a;--muted:#77717b}*{box-sizing:border-box}body{margin:0;background:#faf8fa;color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}header{background:white;padding:22px 20px 15px;position:sticky;top:0;z-index:2;border-bottom:1px solid #eee}header h1{margin:0;color:var(--pink);font-size:24px}header small{color:var(--muted)}main{max-width:620px;margin:auto;padding:18px 16px 110px}.summary{background:linear-gradient(125deg,#d81b60,#ad1457);color:white;padding:22px;border-radius:20px;display:flex;justify-content:space-between;gap:10px}.summary strong{font-size:25px}.summary small{opacity:.9}.heading{display:flex;justify-content:space-between;align-items:center;margin:23px 0 12px}.heading h2{font-size:18px;margin:0}.hint{font-size:12px;color:var(--muted)}.entry{background:white;border:1px solid #eee;border-radius:16px;padding:16px;margin-bottom:11px;cursor:pointer}.entry .date{color:var(--muted);font-size:12px}.entry .name{font-weight:700;margin:7px 0}.entry .meta{display:flex;justify-content:space-between;color:#635b65;font-size:13px;gap:10px}.empty{text-align:center;color:var(--muted);padding:55px 12px;background:white;border-radius:18px}.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:22px;width:62px;height:62px;border-radius:50%;border:0;background:var(--pink);color:white;font-size:36px;box-shadow:0 5px 18px #d81b6060;z-index:4;cursor:pointer}.screen{display:none;position:fixed;inset:0;z-index:5;background:#faf8fa;overflow-y:auto;padding-bottom:calc(32px + env(safe-area-inset-bottom))}.screen.active{display:block}.bar{background:white;position:sticky;top:0;padding:16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #eee;z-index:2}.bar button{border:0;background:none;color:var(--pink);font-size:24px;cursor:pointer}.bar strong{font-size:18px}.form{max-width:620px;margin:auto;padding:20px 16px}label{display:block;font-weight:650;font-size:14px;margin:18px 0 8px}input,textarea,select{width:100%;border:1px solid #ded7dd;background:white;border-radius:12px;padding:13px;font:inherit;font-size:16px;color:var(--ink)}textarea{min-height:90px;resize:vertical}.suggestions{background:white;border:1px solid #eee;border-radius:12px;overflow:hidden;margin-top:5px;max-height:185px;overflow-y:auto}.suggestions button{display:block;text-align:left;width:100%;padding:12px;border:0;border-bottom:1px solid #f2edf0;background:white;font-size:14px;color:var(--ink)}.categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.categories button,.chips button{border:1px solid #e6dce1;background:white;border-radius:22px;padding:9px 12px;white-space:nowrap;color:var(--ink);cursor:pointer}.categories button.active,.chips button.selected{background:var(--pink);border-color:var(--pink);color:white}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.selected-list{font-size:13px;color:var(--pink);margin-top:10px;min-height:18px}.save{width:100%;background:var(--pink);color:white;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;margin-top:25px;cursor:pointer}.secondary{border:1px solid #ddd;background:white;color:#444;padding:12px;border-radius:12px;margin-top:12px}.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photos img{width:75px;height:75px;object-fit:cover;border-radius:10px}.detail{white-space:pre-wrap;background:white;border-radius:15px;padding:18px;line-height:1.7}.danger{color:#b00020}.toolbar{display:flex;gap:10px;margin-top:14px}.toolbar button{flex:1}.footer{font-size:12px;color:var(--muted);margin-top:25px;line-height:1.6}button{touch-action:manipulation}</style><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><header><h1>♥ ビヨログ</h1><small>わたしの美容医療記録</small></header><main><div class="summary"><div><small>累計施術費用（未入力あり）</small><br><strong id="total">¥0</strong></div><div style="text-align:right"><small>施術記録</small><br><strong id="count">0件</strong></div></div><div class="heading"><h2>施術履歴</h2><span class="hint">施術日の新しい順 ↓</span></div><div id="records"></div><p class="footer">この試作品のデータは、このブラウザ内に保存されます。ブラウザデータの削除や端末変更で消える場合があります。下のバックアップ機能をご利用ください。</p><div class="toolbar"><button class="secondary" onclick="backup()">バックアップ保存</button><button class="secondary" onclick="document.getElementById('restore').click()">バックアップ復元</button></div><input id="restore" type="file" accept="application/json" hidden onchange="restoreData(event)"></main><button class="fab" aria-label="記録を追加" onclick="openForm()">＋</button><section class="screen" id="editor"><div class="bar"><button onclick="closeScreen('editor')">‹</button><strong id="formTitle">施術を記録</strong></div><div class="form"><label for="date">施術日 *</label><input id="date" type="date"><label for="clinic">クリニック名 *</label><input id="clinic" placeholder="入力または履歴から選択" autocomplete="off" oninput="showClinics()" onfocus="showClinics()"><div id="clinicSuggestions" class="suggestions" style="display:none"></div><label>施術内容 *（複数選択可）</label><div id="categories" class="categories"></div><div id="procedures" class="chips"></div><div id="chosen" class="selected-list"></div><label for="newProcedure">選択肢にない施術を追加</label><div style="display:flex;gap:8px"><input id="newProcedure" placeholder="施術名"><button class="secondary" style="margin:0;white-space:nowrap" onclick="addProcedure()">追加</button></div><label for="price">施術料金（円）</label><input id="price" type="number" min="0" inputmode="numeric" placeholder="例：25000"><label for="memo">メモ</label><textarea id="memo" placeholder="施術部位・使用製剤・感想など"></textarea><label for="photoInput">写真（任意）</label><input id="photoInput" type="file" accept="image/*" multiple onchange="previewPhotos(event)"><div id="photoPreview" class="photos"></div><button class="save" onclick="saveRecord()">記録を保存</button><button class="secondary danger" id="deleteBtn" style="display:none;width:100%" onclick="deleteRecord()">この記録を削除</button></div></section><section class="screen" id="viewer"><div class="bar"><button onclick="closeScreen('viewer')">‹</button><strong>施術の詳細</strong></div><div class="form" id="detail"></div></section><script>
const KEY='biyolog-pwa-v1';const initial={records:[],clinics:[],custom:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db){db=structuredClone(initial)}db.records||=[];db.clinics||=[];db.custom||=[];
const groups={'注入治療':['ボトックス','スキンボトックス','ヒアルロン酸注入','脂肪溶解注射','リジュラン','ジュベルック'],'肌治療・レーザー':['ピコトーニング','ピコフラクショナル','IPL・光治療','ポテンツァ','ダーマペン','ピーリング','ハイドラフェイシャル'],'脱毛':['医療レーザー脱毛','ヒゲ脱毛','全身脱毛'],'アートメイク':['リップアートメイク','眉アートメイク','アイラインアートメイク'],'その他':['HIFU','糸リフト','クマ治療','骨切り','ほくろ除去','ホワイトニング']};let active='注入治療',chosen=[],photos=[],editing=null;const el=id=>document.getElementById(id);const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('保存容量を超えました。写真を減らすかバックアップを保存してください。');return false}}
function render(){const rs=[...db.records].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);el('count').textContent=rs.length+'件';el('total').textContent=rs.some(r=>r.price===null||r.price===undefined)?'未集計':yen(rs.reduce((s,r)=>s+Number(r.price||0),0));el('records').innerHTML=rs.length?rs.map(r=>`<div class="entry" onclick="viewRecord(${r.id})"><div class="date">${esc(r.date.replaceAll('-','.'))}</div><div class="name">${esc(r.procedures.join('・'))}</div><div class="meta"><span>${esc(r.clinic)}</span><strong>${r.price==null?'料金未入力':yen(r.price)}</strong></div></div>`).join(''):'<div class="empty">まだ施術履歴がありません。<br>右下の ＋ から登録しましょう。</div>'}
function openForm(id=null){editing=id;const r=db.records.find(x=>x.id===id);el('formTitle').textContent=r?'施術記録を編集':'施術を記録';el('date').value=r?.date||new Date().toLocaleDateString('sv-SE');el('clinic').value=r?.clinic||'';el('price').value=r?.price??'';el('memo').value=r?.memo||'';el('newProcedure').value='';el('photoInput').value='';chosen=[...(r?.procedures||[])];photos=[...(r?.photos||[])];active='注入治療';el('deleteBtn').style.display=r?'block':'none';el('clinicSuggestions').style.display='none';renderCategories();renderPhotos();el('editor').classList.add('active')}
function closeScreen(id){el(id).classList.remove('active');if(id==='editor')render()}
function renderCategories(){el('categories').innerHTML=Object.keys(groups).map(g=>`<button class="${g===active?'active':''}" onclick="setCategory('${g}')">${g}</button>`).join('');const opts=[...groups[active],...(active==='その他'?db.custom:[])];el('procedures').innerHTML=opts.map(p=>`<button class="${chosen.includes(p)?'selected':''}" onclick="toggleProcedure(${JSON.stringify(p).replace(/"/g,'&quot;')})">${esc(p)}</button>`).join('');el('chosen').textContent=chosen.length?'選択中：'+chosen.join('、'):'施術を選択してください'}function setCategory(c){active=c;renderCategories()}function toggleProcedure(p){chosen=chosen.includes(p)?chosen.filter(x=>x!==p):[...chosen,p];renderCategories()}function addProcedure(){const p=el('newProcedure').value.trim();if(!p)return;if(!Object.values(groups).flat().includes(p)&&!db.custom.includes(p))db.custom.push(p);if(!chosen.includes(p))chosen.push(p);active='その他';el('newProcedure').value='';persist();renderCategories()}
function showClinics(){const q=el('clinic').value.trim().toLowerCase();const list=db.clinics.filter(c=>c.toLowerCase().includes(q));el('clinicSuggestions').style.display=list.length?'block':'none';el('clinicSuggestions').innerHTML=list.map((c,i)=>`<button onclick="chooseClinic(${i})">${esc(c)}</button>`).join('');window.clinicMatches=list}function chooseClinic(i){el('clinic').value=window.clinicMatches[i];el('clinicSuggestions').style.display='none'}
async function previewPhotos(e){const fs=[...e.target.files];for(const f of fs){if(!f.type.startsWith('image/'))continue;try{const img=await createImageBitmap(f);const canvas=document.createElement('canvas');const ratio=Math.min(1,1100/Math.max(img.width,img.height));canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);photos.push(canvas.toDataURL('image/jpeg',.72));img.close()}catch(err){alert('画像を読み込めませんでした')}}renderPhotos()}function renderPhotos(){el('photoPreview').innerHTML=photos.map((src,i)=>`<div><img src="${src}"><br><button class="secondary" style="margin:2px 0;padding:5px" onclick="photos.splice(${i},1);renderPhotos()">削除</button></div>`).join('')}
function saveRecord(){const date=el('date').value,clinic=el('clinic').value.trim();if(!date||!clinic||!chosen.length){alert('施術日・クリニック名・施術内容を入力してください');return}const old=db.records.find(x=>x.id===editing);const r={id:old?.id||Date.now(),date,clinic,procedures:[...chosen],price:el('price').value.trim()===''?null:Math.max(0,Number(el('price').value)||0),memo:el('memo').value,photos:[...photos]};const previous=JSON.stringify(db);db.records=old?db.records.map(x=>x.id===old.id?r:x):[...db.records,r];db.clinics=[clinic,...db.clinics.filter(c=>c!==clinic)];if(!persist()){db=JSON.parse(previous);return}closeScreen('editor');render()}function viewRecord(id){const r=db.records.find(x=>x.id===id);if(!r)return;el('detail').innerHTML=`<div class="detail"><div class="date">${esc(r.date)}</div><h2>${esc(r.procedures.join('・'))}</h2><p><b>クリニック</b><br>${esc(r.clinic)}</p><p><b>料金</b><br>${r.price==null?'未入力':yen(r.price)}</p><p><b>メモ</b><br>${esc(r.memo||'なし')}</p><div class="photos">${(r.photos||[]).map(src=>`<img src="${src}" style="width:110px;height:110px" onclick="window.open(this.src)">`).join('')}</div></div><button class="save" onclick="closeScreen('viewer');openForm(${id})">編集する</button>`;el('viewer').classList.add('active')}function deleteRecord(){if(!confirm('この施術記録を削除しますか？'))return;db.records=db.records.filter(r=>r.id!==editing);persist();closeScreen('editor');render()}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='biyolog-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restoreData(e){const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.records)||!Array.isArray(d.clinics)||!Array.isArray(d.custom))throw Error();if(!confirm('現在のデータをバックアップの内容で置き換えますか？'))return;db=d;persist();render();alert('復元しました')}catch(err){alert('有効なバックアップファイルではありません')}finally{e.target.value=''}}persist();render();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
